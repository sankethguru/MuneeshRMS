services:
  muneesh-legacy:
    build: .
    container_name: muneesh-legacy
    ports:
      - "2299:2299"
    volumes:
      - muneesh-legacy-data:/app/data
    restart: unless-stopped
    environment:
      # Set a real value in a ".env" file next to this compose file (a
      # line like SESSION_SECRET=<random string>, e.g. from
      # `openssl rand -hex 32`) — this is what actually signs/verifies
      # session cookies. The Dockerfile sets NODE_ENV=production, so
      # without this the container will refuse to boot at all (rather
      # than silently falling back to a known, hardcoded dev secret) —
      # set this before starting for real.
      - SESSION_SECRET=${SESSION_SECRET:-}

volumes:
  muneesh-legacy-data:
